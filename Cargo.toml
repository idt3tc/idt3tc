[package]
name = "idt3tc"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Texture conversion and processing for idTech 3"
license = "MIT"
publish = false

[lib]
name = "idt3tc"
path = "src/lib.rs"

[[bin]]
name = "idt3tc"
path = "src/main.rs"

[dependencies]
# Decoders only for the formats idt3tc reads; every decoder is attack
# surface (see AGENTS.md), so nothing beyond these is enabled.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "hdr", "pnm", "tga"] }
# Deterministic math: the same results on every target, unlike the
# platform libm behind f32::powf and friends.
libm = "0.2.16"
png = "0.18.1"
rayon = "1.12.0"

[build-dependencies]
cc = "1.11.2"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = true
debug = false

# The tests run whole pipelines on real images; unoptimized float code makes
# that needlessly slow.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
