[workspace]
authors = ["Vorschreibung <vorschreibung@gmail.com>"]
channels = ['conda-forge']
name = "idt3tc"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

# Every task cross compiles for all platforms in dev.py, whatever the host
# is; `pixi run dev --help` lists the remaining subcommands. Rust itself comes
# from rustup (pinned by rust-toolchain.toml), cargo-xwin is installed by
# dev.py since conda-forge does not package it.
[tasks]
dev = { cmd = ["python", "./dev.py"] }
dist = { cmd = ["python", "./dev.py", "dist"] }
test = { cmd = ["python", "./dev.py", "test"] }
repro = { cmd = ["python", "./dev.py", "repro"] }

# Exact pins: the compilers and their bundled runtimes end up in the bytes of
# the binaries, so reproducing a release requires the same versions.
# zig (through cargo-zigbuild) compiles and links the Linux and macOS
# targets; clang-cl, lld-link and llvm-lib build the Windows MSVC targets.
[dependencies]
cargo-zigbuild = "0.24.1.*"
clang = "22.1.8.*"
lld = "22.1.8.*"
llvm-tools = "22.1.8.*"
python = "3.14.*"
zig = "0.17.1.*"
